server:
  port: 8080

spring:
  application:
    name: document-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/sgu
    username: sgu_user
    password: sgu_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: document
        format_sql: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Misma clave HMAC que auth-service: este servicio NO emite tokens, solo los valida.
sgu:
  jwt:
    secret: ${JWT_SECRET:c2d1LWRlbW8tc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1wbGVhc2UtMjU2Yml0cw==}
    issuer: sgu-auth-service
  storage:
    base-path: ${STORAGE_BASE_PATH:./storage}
    allowed-content-types: application/pdf,image/png,image/jpeg
  services:
    academic-service-url: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
    request-timeout-ms: 4000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    mx.edu.sgu.document: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/sgu
    username: sgu_user
    password: sgu_pass

sgu:
  storage:
    base-path: /app/storage
  services:
    academic-service-url: http://academic-service:8080
