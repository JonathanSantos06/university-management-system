spring:
  datasource:
    url: jdbc:h2:mem:sgu_document_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: document

sgu:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy1vbmx5LTI1NmJpdHMh
    issuer: sgu-auth-service-test
  storage:
    base-path: ./build/test-storage
    allowed-content-types: application/pdf,image/png,image/jpeg
  services:
    academic-service-url: http://localhost:19083
    request-timeout-ms: 2000
