server:
  port: 8080

spring:
  application:
    name: admin-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Misma clave HMAC que auth-service: este servicio NO emite tokens, solo los valida.
sgu:
  jwt:
    secret: ${JWT_SECRET:c2d1LWRlbW8tc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1wbGVhc2UtMjU2Yml0cw==}
    issuer: sgu-auth-service
  services:
    student-service-url: ${STUDENT_SERVICE_URL:http://localhost:8082}
    academic-service-url: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8084}
    request-timeout-ms: 4000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    mx.edu.sgu.admin: INFO

---
spring:
  config:
    activate:
      on-profile: docker

sgu:
  services:
    student-service-url: http://student-service:8080
    academic-service-url: http://academic-service:8080
    document-service-url: http://document-service:8080
