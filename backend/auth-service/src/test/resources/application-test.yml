spring:
  datasource:
    url: jdbc:h2:mem:sgu_auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: auth

sgu:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy1vbmx5LTI1NmJpdHMh
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    issuer: sgu-auth-service-test
